<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBZ API</title>
</head>
<body>
    <style>
        *{
            box-sizing: border-box;
        }
        :root {
            --primary-color: #FF521B;
            --secondary-color: #F7D002;
            --terceary-color: #1F2041;
            --color-cuarto: #;
            --color--quiinto: #;
        }
        body {
            background-color: var(--primary-color);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
        }
        header {
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--terceary-color);
        }
        .search {
            background-color: rgb(rgba(9, 255, 0, 0.713));
            border: 5px solid var(--primary-color);
            border-radius: 50px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            padding: 10px 16px;
            color: var(--terceary-color);
        }
        .search::placeholder {
            color: var(--terceary-color);
        }
        .search:focus {
            outline: none;
            background-color: var(--primary-color);
        }
        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje {
            width: 300px;
            margin: 15px;
            background-color: var(--secondary-color);
            box-shadow: 0 5px 5px black;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img {
            width: 100%;
            object-fit: contain;
        }
        .personaje-info {
            color: var(--primary-color);
            display: flex;
            align-items: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 8px 15px 15px;
            letter-spacing: 5px;
        }
        .personaje-info h1 {
            color: var(--color--quinto);
            margin-top: 0;
        }

        .personaje-info h3 {
            color: var(--color--cuarto);
            margin-top: 0;
        }
        .personaje-info span {
            background-color: var(--primary-color);
            padding: 5px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .overview {
            background-color: white;
            padding: 32px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 1s ease-in;
        }
        .personaje:hover .overview {
            transform: translateY(0);
        }
    </style>


    <header>
        <img src="dbz.svg" alt="logo" style="width: auto" height="50px">
        <form id="form">
            <input type="text" id="search" class="search" placeholder="Busca tu personaje">
        </form>
    </header>
    <main id="main"></main>
    
    <script>
        const API_URL = 'https://dragonball-api.com/api/characters';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getCharacters(API_URL)

        async function getCharacters(url){
            const res = await fetch(url);
            const data = await res.json();

            showCharacters(data.items);
        }
        function showCharacters(characters){
            main.innerHTML = '';

            characters.forEach((character) => {
                // Esta linea va a poner todos los elementos a principio , para eso el
                //forEach es smimilar al "for", pero el for tiene su inclinacion,  condicion y limitante
                const {id, name, image, ki, maxKi, race, gender, description} = character;
                //esta linea pone lo que nos va a interesar del API que vamos a obtener
                const charElements = document.createElement('div');
                charElements.classList.add('personaje');
                charElements.innerHTML = `
                <img src = "${image}" alt="${image}">
                <div class="personaje-info">
                    <div class="personaje-info">
                    <h1>${id}</h1>
                    <h3>${name}</h3>
                    <br>
                    ${race}
                </div>
                <div> class="overview"
                    <h3>Descripcion</h3>
                    <p><strong>Ki:</strong> ${ki}</p>
                    <p><strong>Max Ki:</strong> ${maxKi}</p>
                    ${description}
                </div>`;
                main.appendChild(charElements);
            })}
                form.addEventListener('submit', (e) => {
                    e.preventDefault()
                    const searchTerm = search.value.toLowerCase();
                    if(searchTerm && searchTerm !== ''){
                        getCharacters(SEARCH_API + `?name ${searchTerm}`)
                        search.value='';
                    }else{window.location.reload();}

                })
    </script>

</body>
</html>
